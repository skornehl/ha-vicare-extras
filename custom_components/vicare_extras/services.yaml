set_holiday:
  fields:
    program:
      required: true
      default: holiday
      selector:
        select:
          options:
            - holiday
            - holiday_at_home
          translation_key: program
    start:
      required: true
      selector:
        date:
    end:
      required: true
      selector:
        date:
    device_id:
      selector:
        device:
          integration: vicare

change_holiday_end:
  fields:
    program:
      required: true
      default: holiday
      selector:
        select:
          options:
            - holiday
            - holiday_at_home
          translation_key: program
    end:
      required: true
      selector:
        date:
    device_id:
      selector:
        device:
          integration: vicare

cancel_holiday:
  fields:
    program:
      required: true
      default: holiday
      selector:
        select:
          options:
            - holiday
            - holiday_at_home
          translation_key: program
    device_id:
      selector:
        device:
          integration: vicare

execute_command:
  fields:
    feature:
      required: true
      example: heating.dhw.temperature.hygiene
      selector:
        text:
    command:
      required: true
      example: setTemperature
      selector:
        text:
    params:
      example: '{"targetTemperature": 65}'
      selector:
        object:
    device_id:
      selector:
        device:
          integration: vicare

set_schedule_day:
  fields:
    schedule:
      required: true
      default: dhw
      selector:
        select:
          options:
            - heating
            - dhw
            - circulation
          custom_value: true
          translation_key: schedule
    days:
      required: true
      selector:
        select:
          multiple: true
          options: [mon, tue, wed, thu, fri, sat, sun]
          translation_key: day
    entries:
      required: true
      example: '[{"start": "05:30", "end": "06:30"}, {"start": "17:00", "end": "22:00"}]'
      selector:
        object:
    device_id:
      selector:
        device:
          integration: vicare

copy_schedule_day:
  fields:
    schedule:
      required: true
      default: dhw
      selector:
        select:
          options: [heating, dhw, circulation]
          custom_value: true
          translation_key: schedule
    source_day:
      required: true
      selector:
        select:
          options: [mon, tue, wed, thu, fri, sat, sun]
          translation_key: day
    target_days:
      required: true
      selector:
        select:
          multiple: true
          options: [mon, tue, wed, thu, fri, sat, sun]
          translation_key: day
    device_id:
      selector:
        device:
          integration: vicare

